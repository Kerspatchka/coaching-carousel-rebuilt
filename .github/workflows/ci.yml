name: App CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      # Real-save adapter tests remain a controlled local gate because their
      # dynasty fixtures and schema are deliberately excluded from Git.
      - name: Run tracked-input tests
        run: npm run test:ci

      # This also verifies that the tracked UI asset ZIP expands successfully.
      - name: Build renderer
        run: npm run build
